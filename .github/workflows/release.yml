# Direct draft asset uploads avoid Actions artifacts. Failure/retry contract: docs/RELEASE.md.
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing tag; blank uses VERSION from version.h.in'
        required: false
        type: string
      platform:
        description: 'Platform to compile and publish'
        required: true
        type: choice
        options: [all, windows, linux, macos-arm64, macos-x64]
        default: all
      draft:
        description: 'Keep as draft after all selected platforms succeed'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.prepare.outputs.sha }}
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate source and prepare draft
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
        run: ./scripts/Release-Actions.ps1 -Phase Prepare
  build:
    name: Publish assets (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set package version
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $file = Join-Path $PWD 'version.h.in'
          $text = Get-Content -LiteralPath $file -Raw
          $text = $text -replace '(?m)^#define VERSION "[^"]*"', ('#define VERSION "' + $env:RELEASE_TAG.Substring(1) + '"')
          Set-Content -LiteralPath $file -Value $text -NoNewline
      - uses: ./.github/actions/native-build
      - name: Package and validate runtime
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: ./scripts/Package-Actions.ps1
      - name: Upload only to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: ./scripts/Release-Actions.ps1 -Phase Upload
  finalize:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Finalize selected platform release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_PLATFORM: ${{ inputs.platform }}
          KEEP_DRAFT: ${{ inputs.draft }}
        run: ./scripts/Release-Actions.ps1 -Phase Finalize
