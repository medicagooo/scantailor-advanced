name: Native build
description: Shared GitHub-hosted build used by CI checks and Release packaging
inputs:
  check:
    description: Build and execute tests (CI only)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      id: python
      with:
        python-version: '3.12.10'
        cache: pip
        cache-dependency-path: scripts/requirements-pdf.txt
    - uses: msys2/setup-msys2@v2
      id: msys
      if: runner.os == 'Windows'
      with:
        msystem: MINGW64
        update: true
        install: >-
          mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-gdb
          mingw-w64-x86_64-qt5-base mingw-w64-x86_64-qt5-svg mingw-w64-x86_64-qt5-tools
          mingw-w64-x86_64-boost mingw-w64-x86_64-libjpeg-turbo
          mingw-w64-x86_64-libpng mingw-w64-x86_64-libtiff mingw-w64-x86_64-zlib
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      shell: pwsh
      run: |
        sudo apt-get update
        if ($LASTEXITCODE -ne 0) { throw 'apt update failed' }
        sudo apt-get install -y build-essential cmake ninja-build qtbase5-dev libqt5opengl5-dev libqt5svg5-dev qttools5-dev qttools5-dev-tools libboost-test-dev libboost-dev libjpeg-dev libpng-dev libtiff-dev zlib1g-dev file
        if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
    - name: Build and optionally check
      shell: pwsh
      env:
        CI_PYTHON: ${{ steps.python.outputs.python-path }}
        MSYS_LOCATION: ${{ steps.msys.outputs.msys2-location }}
        CHECK_BUILD: ${{ inputs.check }}
      run: |
        "CI_PYTHON=$env:CI_PYTHON" >> $env:GITHUB_ENV
        if ($IsWindows) {
          $env:NATIVE_CI_ROOT = Join-Path $env:MSYS_LOCATION 'mingw64'
          "NATIVE_CI_ROOT=$env:NATIVE_CI_ROOT" >> $env:GITHUB_ENV
          (Join-Path $env:NATIVE_CI_ROOT 'bin') >> $env:GITHUB_PATH
        }
        & ./scripts/Build-Actions.ps1 -Check:($env:CHECK_BUILD -eq 'true')
